name: Build AutomationNav Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install pytest

      - name: Validate Python
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q

      - name: Build AutomationNav.exe
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AutomationNav --collect-all playwright main.py

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AutomationNav.exe")) {
            throw "AutomationNav.exe no fue generado."
          }
          Get-Item "dist\AutomationNav.exe" | Format-List Name,Length,LastWriteTime

      - name: Smoke test packaged UI startup
        shell: pwsh
        run: |
          $marker = Join-Path $env:LOCALAPPDATA "AutomationNav\startup_ready.flag"
          $startupLog = Join-Path $env:LOCALAPPDATA "AutomationNav\logs\startup_error.log"
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath "dist\AutomationNav.exe" -PassThru

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()

            if ($process.HasExited) {
              if (Test-Path $startupLog) {
                Write-Host "---- startup_error.log ----"
                Get-Content $startupLog
              }
              throw "AutomationNav.exe se cerró durante la prueba de arranque."
            }

            if (Test-Path $marker) {
              $ready = $true
              break
            }
          }

          if (-not $ready) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "AutomationNav.exe siguió activo, pero Tkinter no confirmó la creación de la interfaz."
          }

          Write-Host "Interfaz Tkinter inicializada correctamente."
          Get-Content $marker
          Stop-Process -Id $process.Id -Force

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AutomationNav-Windows
          path: dist/AutomationNav.exe
          if-no-files-found: error
          retention-days: 14
