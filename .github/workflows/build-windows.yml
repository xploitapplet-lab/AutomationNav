name: Build AutomationNav Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install pytest

      - name: Validate Python
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q

      - name: Build AutomationNav.exe
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AutomationNav --collect-all playwright main.py

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AutomationNav.exe")) {
            throw "AutomationNav.exe no fue generado."
          }
          Get-Item "dist\AutomationNav.exe" | Format-List Name,Length,LastWriteTime

      - name: Smoke test packaged window
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\AutomationNav.exe" -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()

          if ($process.HasExited) {
            $startupLog = Join-Path $env:LOCALAPPDATA "AutomationNav\logs\startup_error.log"
            if (Test-Path $startupLog) {
              Write-Host "---- startup_error.log ----"
              Get-Content $startupLog
            }
            throw "AutomationNav.exe se cerró durante la prueba de arranque."
          }

          $windowFound = $false
          for ($i = 0; $i -lt 10; $i++) {
            $process.Refresh()
            if (-not [string]::IsNullOrWhiteSpace($process.MainWindowTitle)) {
              $windowFound = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }

          if (-not $windowFound) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "AutomationNav.exe sigue activo, pero no creó una ventana principal visible."
          }

          Write-Host "Ventana detectada: $($process.MainWindowTitle)"
          Stop-Process -Id $process.Id -Force

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AutomationNav-Windows
          path: dist/AutomationNav.exe
          if-no-files-found: error
          retention-days: 14
